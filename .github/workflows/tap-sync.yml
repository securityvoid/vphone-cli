name: tap-sync

# Opt-in: republishes the Homebrew casks for the latest release to the tap
# repository named by the TAP_REPO variable. The notarized Launchpad zip is
# attached by hand after the release workflow has finished, so the casks the
# release workflow wrote point at the unsigned zip until this runs again. The
# script changes nothing when the casks are already current. Run it by hand
# from the Actions tab to publish sooner.

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default is the latest release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tap
  cancel-in-progress: false

jobs:
  tap:
    if: vars.TAP_REPO != ''
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Publish casks
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          TAP_REPO: ${{ vars.TAP_REPO }}
          VPHONE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          zsh scripts/brew-cask.zsh "$tag" --push tap
